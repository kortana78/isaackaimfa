</head>
<body>

  <header class="site-header container">
    <div class="site-title"><a href="../index.html">Isaac Kaimfa</a></div>
    <nav class="site-nav">
      <a href="../notes/index.html">Notes</a>
      <a href="index.html">Papers</a>
    </nav>
  </header>

  <main class="container">

    <!-- ============================================================
         PAPER HEADER
         ============================================================ -->
    <div class="post-header">
      <!-- PAPER TITLE -->
      <h1 class="post-title">A Paper Title Goes Here</h1>
      <!-- DATE / JOURNAL / VENUE — e.g. "Published in Journal of X, 2026" -->
      <div class="post-meta">2026</div>
    </div>

    <!-- ============================================================
         ABSTRACT — write the full abstract here
         ============================================================ -->
    <div class="abstract">
      <strong>Abstract</strong>
      <!-- WRITE ABSTRACT HERE -->
      This paper argues that... [write your full abstract here. It can be
      multiple sentences. Just keep it inside this div.]
    </div>

    <!-- ============================================================
         DOWNLOAD BUTTON — update href to point to your actual PDF
         The PDF file should live in the /pdfs/ folder
         ============================================================ -->
    <div class="paper-actions">
      <a href="../pdfs/paper-template.pdf" download>Download PDF</a>
    </div>

    <!-- ============================================================
         INLINE PDF VIEWER
         Update the src to match your actual PDF filename in /pdfs/
         Readers can scroll through the PDF right on the page.
         If the browser blocks the embed, the download button above
         is always available.
         ============================================================ -->
    <iframe
      class="pdf-viewer"
      src="../pdfs/paper-template.pdf"
      title="Paper PDF viewer">
      <!-- Fallback message if iframe is not supported -->
      Your browser cannot display the PDF inline.
      <a href="../pdfs/paper-template.pdf">Download it here.</a>
    </iframe>

  </main>
