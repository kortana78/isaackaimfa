    <h1>Papers</h1>

    <ul class="entry-list">

      <!-- ============================================================
           PAPER ENTRY — when you add a new paper:
             1. Drop the PDF into the /pdfs/ folder
             2. Duplicate this entire <li> block
             3. Create a matching HTML page using paper-template.html
             4. Update all the fields below
           ============================================================ -->
      <li>
        <div class="entry-title">
          <a href="paper-template.html"><!-- PAPER TITLE -->A Paper Title Goes Here</a>
        </div>
        <!-- DATE / JOURNAL / CONFERENCE / WORKING PAPER -->
        <div class="entry-meta">June 2026</div>
        <div class="entry-abstract">
          <!-- ONE OR TWO SENTENCE ABSTRACT SNIPPET shown on this index -->
          A brief sentence summarising the argument or findings of the paper.
        </div>
        <div class="paper-actions">
          <!-- "Read" links to the paper's HTML page (abstract + inline PDF) -->
          <a href="paper-template.html">Read</a>
          <!-- "Download PDF" links directly to the PDF file -->
          <a href="../pdfs/paper-template.pdf" download>Download PDF</a>
        </div>
      </li>
      <!-- END PAPER ENTRY -->

    </ul>
